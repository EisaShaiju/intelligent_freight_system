version: '3.8'

services:
  # Zookeeper is required to manage the Kafka cluster
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ibs-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # The Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ibs-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      # Expose Kafka to your local Python scripts outside Docker
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Automatically create our anomalies topic when the broker starts
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1